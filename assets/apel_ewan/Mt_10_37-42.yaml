siglum: Mt 10, 37-42
edition: Biblia Tysiąclecia
folders:
- niedziele_obozowe_2026_zh
- niedziele_obozowe_2026_hsw
text: |-
  Kto kocha ojca lub matkę bardziej niż Mnie, nie jest Mnie godzien. I kto kocha syna lub córkę bardziej niż Mnie, nie jest Mnie godzien. Kto nie bierze swego krzyża, a idzie za Mną, nie jest Mnie godzien. Kto chce znaleźć swe życie, straci je, a kto straci swe życie z mego powodu, znajdzie je.

  Kto was przyjmuje, Mnie przyjmuje; a kto Mnie przyjmuje, przyjmuje Tego, który Mnie posłał. Kto przyjmuje proroka, jako proroka, nagrodę proroka otrzyma. Kto przyjmuje sprawiedliwego, jako sprawiedliwego, nagrodę sprawiedliwego otrzyma. Kto poda kubek świeżej wody do picia jednemu z tych najmniejszych, dlatego że jest uczniem, zaprawdę powiadam wam, nie utraci swojej nagrody».
variants:
  niedziele_obozowe_2026_zh:
    title: &t Kto was przyjmuje, Mnie przyjmuje
    shortTitle: &s |-
      28.
      czerwca
      2026 r.
    comment: &c |-
      Pierwsze zdania tego fragmentu to jedne z najbardziej szokujących słów Jezusa. Czy On zachęca nas, abyśmy mniej kochali swoich bliskich? Nie! Zaprasza nas do swojej, Boskiej logiki: tylko dzięki doświadczeniu bezwarunkowej miłości Boga do nas będziemy w stanie bardziej kochać innych ludzi.
    questions:
    - 'Aby przyjechać na biwak lub obóz prawdopodobnie musisz pożegnać się ze swoją rodziną. Jakie są Twoje nadzieje: co dobrego może spotkać Cię na wyjeździe, czego nie ma w domu?'
    - Krzyż jest symbolem cierpienia, trudów. Na obozach i biwakach jest wiele niełatwych zadań np. budowanie własnej pryczy, warty nocne, służba w kuchni. Jak myślisz, po co to robimy?
    - Komu dzisiaj możesz podać „kubek świeżej wody” czyli wyświadczyć jakąś przysługę?
  niedziele_obozowe_2026_hsw:
    title: *t
    shortTitle: *s
    comment: *c
    questions:
    - Czy zdarzyło Ci się kiedyś, aby ktoś z Twoich bliskich krytykował lub wyśmiewał Twoją wiarę lub Twoje wartości? Czy zdarzyło Ci się pod wpływem tego zrezygnować z jakichś działań, planów? Jakie towarzyszyły Ci uczucia?
    - W czasie II Wojny Światowej wielu Polaków pomagało Żydom ryzykując życie swoje lub bliskich. Na przykład Józef i Wiktoria Ulmowie za karę za pomoc Żydom zostali rozstrzelani wraz z dziećmi (beatyfikowani w Kościele Katolickim). Wiedzieli jakie mogą spotkać ich konsekwencje. Jak myślisz, co nimi kierowało? Czy uważasz takie postępowanie za dobre? Czy myślisz, że w obecnych czasach są ludzie, którzy mierzą się z podobnymi dylematami?
    - Krzyż jest symbolem cierpienia, trudów. Podczas harcerskiej drogi też często bierzemy na siebie różne trudy, wyzwania. Dlaczego to robisz? Jakie trudne wyzwania czekają Cię w najbliższym czasie? Jakie masz do nich nastawienie?
