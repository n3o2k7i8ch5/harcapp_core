siglum: Mt 16, 21-28
edition: Biblia Tysiąclecia
folders:
- hal-2026-1
- hal-2026-2
text: |-
  Odtąd zaczął Jezus [Chrystus] wskazywać swoim uczniom na to, że musi udać się do Jerozolimy i wiele wycierpieć od starszych i arcykapłanów oraz uczonych w Piśmie; że będzie zabity i trzeciego dnia zmartwychwstanie. A Piotr wziął Go na bok i począł robić Mu wyrzuty: «Panie, niech Cię Bóg broni! Nie przyjdzie to nigdy na Ciebie». Lecz On odwrócił się i rzekł do Piotra: «Zejdź Mi z oczu, szatanie! Jesteś Mi zawadą, bo nie myślisz po Bożemu, lecz po ludzku».

  Wtedy Jezus rzekł do swoich uczniów: «Jeśli ktoś chce pójść za Mną, niech się zaprze samego siebie, niech weźmie krzyż swój i niech Mnie naśladuje. Bo kto chce zachować swoje życie, straci je; a kto straci swe życie z mego powodu, znajdzie je. Cóż bowiem za korzyść odniesie człowiek, choćby cały świat zyskał, a na swej duszy szkodę poniósł? Albo co da człowiek w zamian za swoją duszę? Albowiem Syn Człowieczy przyjdzie w chwale Ojca swego razem z aniołami swoimi i wtedy odda każdemu według jego postępowania. Zaprawdę, powiadam wam: Niektórzy z tych, co tu stoją, nie zaznają śmierci, aż ujrzą Syna Człowieczego przychodzącego w królestwie swoim».
variants:
  hal-2026-1:
    title: &t Pierwsza zapowiedź męki i zmartwychwstania
    shortTitle: &s |-
      30.
      sierpnia
      2026 r.
    comment: &c |-
      Słowa Jezusa do Piotra „Zejdź Mi z oczu, szatanie” w niektórych przekładach Biblii są tłumaczone jako „Idź za mną szatanie” - idź za mną czyli znaj swoje miejsce. Uczniowie Jezusa, w tym Piotr, mieli problem z tym, aby zaakceptować prawdziwą misję Jezusa, jaką jest śmierć na krzyżu oraz zmartwychwstanie (jest o tym mowa na samym początku fragmentu). Oni oczekiwali czegoś innego: Mesjasza, który zbrojną ręką przywróci królestwo Izraela. To jedyny moment w Ewangelii, kiedy Jezus używa sformułowania „szatanie” w stosunku do człowieka. Warto wiedzieć, że to słowo w hebrajskim nie musi oznaczać dosłownie złego ducha, ale także kusiciela, nieprzyjaciela. W ten sposób kategorycznie potępia postawę Piotra, który chciałby dostosować misję Boga do swoich oczekiwań.
    questions:
    - 'Na co „tracisz swoje życie” - co robisz w wolnym czasie? Czy są to zajęcia pożyteczne dla Ciebie lub innych ludzi?'
    - Krzyż jest symbolem cierpienia, trudów. Jakie są ostatnio trudy, z którymi się mierzysz? Jak myślisz, czego Cię one nauczyły?
    - '„Niech mnie naśladuje” - jak myślisz, co to znaczy naśladować Jezusa? Co konkretnie dziś możesz zrobić, co byłoby naśladowaniem Jezusa?'
  hal-2026-2:
    title: *t
    shortTitle: *s
    comment: *c
    questions:
    - Czy przypominasz sobie takie sytuacje, gdy ktoś dla Ciebie ważny miał inny pomysł na swoją przyszłość niż Ty oczekiwałaś/eś? Jakie emocje Ci towarzyszyły?
    - Czy zdarza Ci się żyć/postępować tak, jakbyś był mądrzejszy od Boga? W jakich sytuacjach ma to miejsce?
    - 'Na co „tracisz swoje życie”? Tzn jakie sprawy są w tej chwili Twoimi głównymi kierunkami w życiu, głównymi pragnieniami? A może poświęcasz czas na rzeczy przypadkowe, tak zwane rozpraszacze?'
    - '„Niech weźmie swój krzyż” - w tym momencie życia, w którym jesteś, jakie są Twoje główne trudności? Czy masz odwagę stawić im czoło?'
    - '„niech mnie naśladuje” - jak myślisz, co to znaczy naśladować Jezusa? Co to oznacza dla Ciebie osobiście? Co to może znaczyć dla chrześcijan? Czy dla osób niewierzących Jezus może być także autorytetem?'
