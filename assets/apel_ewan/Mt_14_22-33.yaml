siglum: Mt 14, 22-33
edition: Biblia Tysiąclecia
folders:
- hal-2026-1
- hal-2026-2
text: |-
  Zaraz też przynaglił uczniów, żeby wsiedli do łodzi i wyprzedzili Go na drugi brzeg, zanim odprawi tłumy. Gdy to uczynił, wyszedł sam jeden na górę, aby się modlić. Wieczór zapadł, a On sam tam przebywał. Łódź zaś była już o wiele stadiów oddalona od brzegu, miotana falami, bo wiatr był przeciwny. Lecz o czwartej straży nocnej przyszedł do nich, krocząc po jeziorze. Uczniowie, zobaczywszy Go kroczącego po jeziorze, zlękli się myśląc, że to zjawa, i ze strachu krzyknęli. Jezus zaraz przemówił do nich: «Odwagi! To Ja jestem, nie bójcie się!» Na to odezwał się Piotr: «Panie, jeśli to Ty jesteś, każ mi przyjść do siebie po wodzie!» A On rzekł: «Przyjdź!» Piotr wyszedł z łodzi i krocząc po wodzie, podszedł do Jezusa. Lecz na widok silnego wiatru uląkł się i gdy zaczął tonąć, krzyknął: «Panie, ratuj mnie!» Jezus natychmiast wyciągnął rękę i chwycił go, mówiąc: «Czemu zwątpiłeś, człowiecze małej wiary?» Gdy wsiedli do łodzi, wiatr się uciszył. Ci zaś, którzy byli w łodzi, upadli przed Nim, mówiąc: «Prawdziwie jesteś Synem Bożym».
variants:
  hal-2026-1:
    title: &t Jezus chodzi po jeziorze
    shortTitle: &s |-
      9.
      sierpnia
      2026 r.
    questions:
    - Jezus na początku nie wsiadł do łódki razem z uczniami, tylko poszedł pobyć trochę sam. Czy Ty też czasami lubisz pobyć trochę samemu? Dlaczego?
    - Piotr zobaczył, jak Jezus idzie po wodzie – I też chciał iść tak jak On. Czy zdarza Ci, że też chcesz być taki jak twoi koledzy? Czy dobrze jest czasami naśladować innych? A czy są sytuacje, kiedy naśladowanie jest złe?
    - Kiedy Piotr przestraszył się i zaczął tonąć, Jezus złapał go za rękę i uratował. W przenośni mówi się, że ktoś tonie – to znaczy, że ma problem, z którym nie potrafi sobie poradzić. Co Ty możesz zrobić, jeżeli zauważysz, że twój kolega „tonie”? A co możesz zrobić, jeżeli ty sam masz wrażenie, że toniesz?
  hal-2026-2:
    title: *t
    shortTitle: *s
    questions:
    - Dlaczego Jezus nie wsiadł do łodzi razem z uczniami? Miał dosyć ludzi? Chciał pobyć trochę sam? Albo coś udowodnić swoim uczniom?
    - Czemu Piotr chciał również przyjść do Jezusa po wodzie? Pozazdrościł Mu dobrej zabawy?
    - 'Uczniowie początkowo nie umieli rozpoznać czy to Bóg do nich przychodzi czy tylko „zjawa”. W jaki sposób Ty rozpoznajesz czy różne Twoje pomysły, zamiary są rzeczywiście dobre czy są tylko ułudą dobra?'
    - Piotr zaczął tonąć wtedy, gdy uląkł się silnego wiatru. Czy w Twoim życiu był taki moment, kiedy wydawało Ci się, że toniesz? Jak myślisz, dlaczego tak się wydarzyło? Jakie emocje Ci wtedy towarzyszyły? Co pomogło Ci z powrotem wypłynąć na powierzchnię?
    - Cuda, które Pan Jezus czynił na świecie, zazwyczaj polegały na wyświadczeniu ludziom jakiegoś dobra. Rozmnożenie chleba, by nakarmić głodnych, uzdrawianie chorych, przywrócenie zmarłych do życia... Co dobrego wyniknęło z tego, że spacerował sobie po jeziorze?
