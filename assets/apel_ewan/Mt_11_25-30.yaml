siglum: Mt 11, 25-30
edition: Biblia Tysiąclecia
folders:
- hal-2026
text: |-
  W owym czasie Jezus przemówił tymi słowami: Wysławiam Cię, Ojcze, Panie nieba i ziemi, że zakryłeś te rzeczy przed mądrymi i roztropnymi, a objawiłeś je prostaczkom. Tak, Ojcze, gdyż takie było Twoje upodobanie. Wszystko przekazał Mi Ojciec mój. Nikt też nie zna Syna, tylko Ojciec, ani Ojca nikt nie zna, tylko Syn, i ten, komu Syn zechce objawić. Przyjdźcie do Mnie wszyscy, którzy utrudzeni i obciążeni jesteście, a Ja was pokrzepię. Weźcie na siebie moje jarzmo i uczcie się ode Mnie, bo jestem cichy i pokornego serca, a znajdziecie ukojenie dla dusz waszych. Albowiem słodkie jest moje jarzmo, a moje brzemię lekkie.
variants:
  hal-2026-jr:
    title: &t Jezus cichy i pokornego serca
    shortTitle: &s |-
      5.
      lipca
      2026 r.
    comment: &c |-
      Pokora bywa kojarzona z kimś wycofanym, zawsze ustępującym, wiecznie przepraszającym. Ale prawdziwa cnota pokory to myślenie o sobie zgodnie z tym co jest prawdą o nas samych, poznanie swoich mocnych oraz słabych stron, złoty środek między pychą, a pogardą wobec samego siebie.
    questions:
    - Gdy jest Ci smutno na biwaku lub obozie, u kogo szukasz pocieszenia? Czy warto tej osobie podziękować?
    - Czy Ty potrafisz pocieszać innych, gdy jest im smutno?
    - Człowiek pokorny to człowiek, który widzi swoje mocne oraz słabe strony. Zastanów się nad dzisiejszym dniem. Co dobrego udało Ci się dziś zrobić? Co dobrego możesz jeszcze dziś zrobić?
    - Jeśli zrobiłeś/aś dziś coś, co sprawiło komuś przykrość – spróbuj przeprosić tę osobę i pogodzić się z nią.
  hal-2026-sr:
    title: *t
    shortTitle: *s
    comment: *c
    questions:
    - Co jest Twoim źródłem? Skąd czerpiesz siły na co dzień? Gdzie szukasz pocieszenia, gdy jest Ci źle?
    - Czy potrafisz odpoczywać? Co wtedy robisz?
    - Co to znaczy być pokornym? Czy Ty jesteś człowiekiem pokornym?
    - Dlaczego Jezus cieszy się, że jego naukę przyjmują ludzie prości, a niekoniecznie ludzie uczeni?
    - Jeden wniosek, który z dzisiejszych rozmyślań zabierzesz do swojej codzienności.
