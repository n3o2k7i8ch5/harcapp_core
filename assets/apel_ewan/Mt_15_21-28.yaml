siglum: Mt 15, 21-28
edition: Biblia Tysiąclecia
folders:
- hal-2026-1
- hal-2026-2
text: |-
  Potem Jezus odszedł stamtąd i podążył w okolice Tyru i Sydonu. A oto kobieta kananejska, wyszedłszy z tamtych stron, wołała: «Ulituj się nade mną, Panie, Synu Dawida! Moja córka jest ciężko nękana przez złego ducha». Lecz On nie odezwał się do niej ani słowem. Na to podeszli Jego uczniowie i prosili Go: «Odpraw ją, bo krzyczy za nami». Lecz On odpowiedział: «Jestem posłany tylko do owiec, które poginęły z domu Izraela». A ona przyszła, padła Mu do nóg i prosiła: «Panie, dopomóż mi». On jednak odparł: «Niedobrze jest zabierać chleb dzieciom, a rzucać szczeniętom». A ona odrzekła: «Tak, Panie, lecz i szczenięta jedzą okruchy, które spadają ze stołu ich panów». Wtedy Jezus jej odpowiedział: «O niewiasto, wielka jest twoja wiara; niech ci się stanie, jak pragniesz!» Od tej chwili jej córka była zdrowa.
variants:
  hal-2026-1:
    title: &t Wiara niewiasty kananejskiej
    shortTitle: &s |-
      16.
      sierpnia
      2026 r.
    comment: &c |-
      Jezus początkowo wydaje się oschły wobec tej kobiety. To było jednak zgodne z ówczesnymi zasadami Żydów. Kobieta kananejska była poganką. Żydzi w tamtych czasach uważali kontakt z poganami za coś niewłaściwego. Na koniec Jezus przełamuje te zasady. Odpowiada na potrzeby kobiety, pokazując, że takie nasze, przez ludzi stworzone granice, dla niego nie mają znaczenia.
    questions:
    - Gdy masz jakiś problem, do kogo najczęściej zwracasz się z prośbą o pomoc?
    - Czy tu i teraz są jakieś sprawy, w których warto zwrócić się o pomoc do kogoś innego?
    - Jak reagujesz, gdy inni proszą Ciebie o pomoc?
    - Czy tu i teraz zauważasz, że są jakieś osoby, do których podchodzisz z uprzedzeniem?
  hal-2026-2:
    title: *t
    shortTitle: *s
    comment: *c
    questions:
    - Kananejka była wytrwała w swojej prośbie. Potrafiła nawet przełamać ówczesne konwenanse, aby „zawalczyć” o dobro swojej córki. Czy Ty potrafisz prosić o pomoc? Jeśli jest to dla Ciebie trudne to dlaczego?
    - Czy tu i teraz są jakieś sprawy, w których warto zwrócić się o pomoc do kogoś innego?
    - Jezus dokonał rzeczy pozornie niemożliwej uzdrawiając córkę Kananejki. Czy w Twoim życiu zdarzył się kiedyś podobny lub inny cud? Czy zdarza ci się prosić o jakiś cud?
    - Czy zdarza Ci się z uprzedzeniem podchodzić do niektórych ludzi różnych od Ciebie? Zastanów się, z czego to wynika? Co możesz zrobić, aby zmienić swoje nastawienie?
    - Czy tu i teraz zauważasz, że są jakieś osoby, do których podchodzisz z uprzedzeniem?
